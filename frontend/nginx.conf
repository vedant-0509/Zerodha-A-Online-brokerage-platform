server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://zerodha-backend-mm0p.onrender.com/api/;

        proxy_http_version 1.1;

        # Required for Render's HTTPS virtual host
        proxy_ssl_server_name on;
        proxy_ssl_name zerodha-backend-mm0p.onrender.com;

        proxy_set_header Host zerodha-backend-mm0p.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /socket.io/ {
        proxy_pass https://zerodha-backend-mm0p.onrender.com/socket.io/;

        proxy_http_version 1.1;

        # Required for Render HTTPS upstream
        proxy_ssl_server_name on;
        proxy_ssl_name zerodha-backend-mm0p.onrender.com;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host zerodha-backend-mm0p.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}